name: Verify service
on:
  push:
    branches: [main, 'harden/**', 'improve/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          VITE_SUPABASE_URL: https://test.invalid
          VITE_SUPABASE_ANON_KEY: test-only-key
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --only-shell chromium
      - run: npm run test:e2e

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test production schema with synthetic data in PostgreSQL 17
        run: |
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace postgres:17 bash -c '
            apt-get update -qq && apt-get install -y -qq nodejs >/dev/null &&
            gosu postgres env PATH="/usr/lib/postgresql/17/bin:$PATH" node scripts/test-db.mjs &&
            gosu postgres env PATH="/usr/lib/postgresql/17/bin:$PATH" CC_VALIDATION_REPORT_DIR=/tmp/cc-validation node scripts/test-db-resilience.mjs
          '

  installed-app-upgrade-browser:
    name: installed-app-upgrade (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install matching browser engine
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify existing member and administrator installations across releases
        env:
          CC_UPGRADE_BASE_REF: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.sha }}
        run: npm run test:installed-upgrade -- ${{ matrix.browser }}
      - name: Save isolated upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-app-upgrade-${{ matrix.browser }}
          path: test-results/installed-app-upgrade/${{ matrix.browser }}/
          if-no-files-found: error
          retention-days: 14

  installed-app-upgrade:
    name: installed-app-upgrade
    if: always()
    needs: [installed-app-upgrade-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require both browser engines
        env:
          UPGRADE_RESULT: ${{ needs.installed-app-upgrade-browser.result }}
        run: test "$UPGRADE_RESULT" = success
